<html lang="es">
<head>

<title>Xpedia v15 · Roadmaps</title>
<link rel="stylesheet" href="_ds/nocturne-fe7002fc-3193-410f-a828-588fe25132bd/styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  :root {
    --ok: oklch(0.78 0.15 150);
    --warn: oklch(0.82 0.14 80);
    --bad: oklch(0.72 0.16 30);
    --line: var(--color-neutral-800);
    --muted: var(--color-neutral-500);
    --soft: var(--color-neutral-400);
    --code-bg: #0f1019;
  }
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-size: 14px; }
  a { color: var(--color-accent-300); text-decoration: none; }
  a:hover { color: var(--color-accent-200); }
  .btn, .tag, .chip { white-space: nowrap; flex-shrink: 0; }
  button { font-family: inherit; }
  @keyframes xpFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes xpFill { from { width: 0; } }
  @keyframes xpPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes xpGlow { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-accent) 0%, transparent); } 40% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--color-accent) 28%, transparent); } }
  @keyframes xpWave { 0%,100% { height: 6px; } 50% { height: 34px; } }
  @keyframes xpSlide { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes xpSpin { to { transform: rotate(360deg); } }
  @keyframes xpDots { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }

  /* ── header ── */
  .top { display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--color-neutral-900); position: sticky; top: 0; z-index: 40; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-mark { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--color-accent); display: flex; align-items: center; justify-content: center; color: var(--color-accent); }
  .brand-name { letter-spacing: .14em; font-size: 12px; text-transform: uppercase; }
  .vtag { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .switch { display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--color-bg); border: 1px solid var(--line); }
  .switch button { display: flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--soft); font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  .switch button.on { background: var(--color-accent-800); color: var(--color-accent-100); }
  .sel { height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--color-bg); color: var(--color-text); font-family: inherit; font-size: 12px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--color-accent-800); color: var(--color-accent-200); display: flex; align-items: center; justify-content: center; font-size: 11px; }

  /* ── layout ── */
  .shell { display: flex; min-height: calc(100vh - 52px); }
  .side { flex: 0 0 224px; border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; scrollbar-width: none; }
  .side::-webkit-scrollbar { display: none; }
  .side-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--color-neutral-300); cursor: pointer; border: 0; background: none; font-size: 14px; text-align: left; width: 100%; }
  .side-item:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
  .side-item.on { background: var(--color-accent-900); color: var(--color-accent-200); }
  .side-item i { font-size: 17px; }
  .side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); }
  .main { flex: 1; min-width: 0; padding: 28px 32px 72px; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .narrow { max-width: 780px; margin: 0 auto; }
  .page { animation: xpFadeIn .25s ease-out; }
  .panel { background: var(--color-surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; }
  .panel.tight { padding: 14px 16px; }
  .panel.flat { background: var(--color-bg); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .grid-half { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .stack-sm { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.wrapx { flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .kicker { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-accent-300); }
  .muted { color: var(--muted); }
  .soft { color: var(--soft); }
  .small { font-size: 12.5px; }
  .tiny { font-size: 11px; }
  .h-page { font-size: 28px; margin: 4px 0 6px; }
  .h-sec { font-size: 17px; margin: 0; }
  p { margin: 0; }
  .lead { font-size: 15px; color: var(--color-neutral-300); line-height: 1.6; }

  /* ── atoms ── */
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--color-neutral-300); }
  .chip.acc { border-color: var(--color-accent-600); color: var(--color-accent-200); background: var(--color-accent-900); }
  .chip.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); color: var(--ok); }
  .chip.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); color: var(--warn); }
  .chip.bad { border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: var(--bad); }
  .src { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; font-size: 11px; color: var(--soft); background: var(--color-neutral-900); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; }
  .btn-solid { background: var(--color-accent-700); border-color: var(--color-accent-600); color: #fff; }
  .btn-solid:hover { background: var(--color-accent-600); }
  .btn-sm { font-size: 12.5px; padding: 4px 9px; }
  .icon-box { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: var(--color-accent-900); color: var(--color-accent-300); border: 1px solid var(--color-accent-800); flex: none; }
  .bar { height: 6px; border-radius: 999px; background: var(--color-neutral-800); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--color-accent-500); border-radius: inherit; animation: xpFill .8s ease-out; }
  .bar.ok > span { background: var(--ok); }
  .divider { height: 1px; background: var(--line); margin: 4px 0; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat b { font-size: 22px; font-weight: 500; }
  .input { background: var(--color-bg); }
  .banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; border: 1px dashed var(--color-accent-700); background: var(--color-accent-900); color: var(--color-accent-100); font-size: 12.5px; }
  .note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--color-neutral-900); border: 1px solid var(--line); font-size: 12.5px; color: var(--color-neutral-300); }
  .note i { margin-top: 2px; color: var(--color-accent-300); }
  .note.warn i { color: var(--warn); }

  /* ── choices & feedback ── */
  .choice { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 13px 15px; border-radius: 12px; border: 1px solid var(--line); background: var(--color-bg); color: var(--color-text); font-size: 13.5px; line-height: 1.5; cursor: pointer; transition: border-color .15s; }
  .choice:hover:not(:disabled) { border-color: var(--color-accent-600); }
  .choice.picked { border-color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }
  .choice.right { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
  .choice.wrong { border-color: color-mix(in srgb, var(--bad) 60%, transparent); opacity: .7; }
  .choice.partial { border-color: color-mix(in srgb, var(--warn) 60%, transparent); }
  .choice:disabled { cursor: default; }
  .choice-big { flex-direction: column; gap: 8px; padding: 18px; }
  .letter { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--soft); }
  .fb { border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.5; border: 1px solid; animation: xpFadeIn .2s; }
  .fb.ok { border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 8%, transparent); }
  .fb.bad { border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 8%, transparent); }
  .fb.warn { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); }
  .fb.info { border-color: var(--color-accent-700); background: var(--color-accent-900); }
  .chipbtn { border: 1px solid var(--line); background: var(--color-bg); color: var(--color-neutral-300); border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; }
  .chipbtn:hover { border-color: var(--color-accent-600); }
  .chipbtn.on { border-color: var(--color-accent); color: var(--color-accent-100); background: var(--color-accent-900); }

  /* ── steps ── */
  .steps { display: flex; gap: 6px; flex-wrap: wrap; }
  .step { font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
  .step.on { border-color: var(--color-accent); color: var(--color-accent-200); }
  .step.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 26px; height: 4px; border-radius: 2px; background: var(--color-neutral-800); }
  .dots span.on { background: var(--color-accent-500); }

  /* ── code ── */
  .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; line-height: 1.6; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow: auto; white-space: pre; color: #d7d9f0; margin: 0; }
  textarea.codeedit { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; line-height: 1.6; background: var(--code-bg); color: #d7d9f0; border: 1px solid var(--color-accent-700); border-radius: 10px; padding: 12px 14px; width: 100%; min-height: 230px; resize: vertical; tab-size: 2; }
  textarea.codeedit:focus { outline: none; border-color: var(--color-accent); }
  .test { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; font-size: 12.5px; border-bottom: 1px solid color-mix(in srgb, var(--color-text) 6%, transparent); }
  .test:last-child { border-bottom: 0; }
  .test i { margin-top: 2px; }
  .t-ok { color: var(--ok); } .t-bad { color: var(--bad); } .t-wait { color: var(--muted); }

  /* ── roadmap ── */
  .path { display: flex; flex-direction: column; gap: 10px; }
  .hito { display: flex; gap: 14px; position: relative; }
  .hito-dot { flex: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--line); background: var(--color-bg); color: var(--muted); z-index: 1; font-size: 13px; }
  .hito.done .hito-dot { background: color-mix(in srgb, var(--ok) 16%, var(--color-bg)); border-color: var(--ok); color: var(--ok); }
  .hito.cur .hito-dot { border-color: var(--color-accent); color: var(--color-accent-100); background: var(--color-accent-800); animation: xpGlow 1.8s ease-out infinite; }
  .hito:not(:last-child)::before { content: ''; position: absolute; left: 16px; top: 34px; bottom: -10px; width: 2px; background: var(--line); }
  .hito.done:not(:last-child)::before { background: color-mix(in srgb, var(--ok) 45%, transparent); }
  .hito-body { flex: 1; min-width: 0; padding: 6px 0 4px; }
  .hito.cur .hito-body { background: var(--color-bg); border: 1px solid var(--color-accent-700); border-radius: 12px; padding: 14px; }
  .hito.lock .hito-body { opacity: .65; }
  .node { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; padding: 5px 0; }
  .node i { font-size: 15px; }

  /* ── tree ── */
  .tree { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .branch { display: flex; flex-direction: column; gap: 8px; }
  .branch-h { font-size: 12px; color: var(--color-neutral-300); padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
  .tnode { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); font-size: 12.5px; background: var(--color-bg); line-height: 1.3; }
  .tnode i { font-size: 15px; flex: none; }
  .tnode.done { border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .tnode.done i { color: var(--ok); }
  .tnode.real { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, var(--color-bg)); }
  .tnode.real i { color: var(--ok); }
  .tnode.next { border-color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent-700); }
  .tnode.next i { color: var(--color-accent-300); }
  .tnode.rust { border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
  .tnode.rust i { color: var(--warn); }
  .tnode.locked { opacity: .45; }

  /* ── chat ── */
  .chat { display: flex; flex-direction: column; gap: 10px; min-height: 320px; max-height: 470px; overflow-y: auto; padding: 4px 2px; }
  .bub { max-width: 84%; padding: 10px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; animation: xpFadeIn .25s; }
  .bub.them { background: var(--color-neutral-800); border-top-left-radius: 4px; align-self: flex-start; }
  .bub.me { background: var(--color-accent-800); color: var(--color-accent-100); border-top-right-radius: 4px; align-self: flex-end; }
  .bub.sys { align-self: center; background: transparent; border: 1px dashed var(--line); color: var(--soft); font-size: 12px; max-width: 92%; }
  .bub-tip { align-self: flex-end; font-size: 11px; margin-top: -4px; }
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 14px; background: var(--color-neutral-800); border-radius: 14px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--soft); animation: xpDots 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  .thermo { height: 10px; border-radius: 999px; background: linear-gradient(90deg, var(--ok), var(--warn), var(--bad)); position: relative; flex: 1; }
  .thermo-mark { position: absolute; top: -5px; width: 6px; height: 20px; margin-left: -3px; border-radius: 3px; background: #fff; box-shadow: 0 0 0 2px var(--color-bg); transition: left .6s ease; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }

  /* ── recording ── */
  .ring { width: 172px; height: 172px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; position: relative; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring b { font-size: 34px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .wave { display: flex; align-items: center; gap: 3px; height: 40px; }
  .wave span { width: 4px; border-radius: 2px; background: var(--color-accent-400); animation: xpWave .9s ease-in-out infinite; }
  .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); animation: xpPulse 1s infinite; display: inline-block; }
  mark.mul { background: color-mix(in srgb, var(--warn) 24%, transparent); color: var(--color-text); border-radius: 3px; padding: 0 2px; }
  .idea { background: color-mix(in srgb, var(--ok) 16%, transparent); border-bottom: 2px solid var(--ok); padding: 0 2px; }
  .transcript { font-size: 14px; line-height: 1.85; color: var(--color-neutral-200); }
  .lvl { display: inline-flex; font-size: 11px; padding: 2px 8px; border-radius: 6px; border: 1px solid; white-space: nowrap; }
  .lvl.i { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .lvl.d { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .lvl.s { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .ts { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--color-accent-300); background: var(--color-accent-900); border-radius: 5px; padding: 1px 5px; }
  details > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] > summary .ph-caret-right { transform: rotate(90deg); }
  .ph-caret-right { transition: transform .15s; }

  /* ── table ── */
  .table td, .table th { vertical-align: top; }
  .table td { font-size: 13px; }
  .heat { display: inline-flex; width: 30px; height: 22px; border-radius: 5px; align-items: center; justify-content: center; font-size: 11px; }

  /* ── drawer & toast ── */
  .drawer { position: fixed; top: 52px; right: 0; bottom: 0; width: min(410px, 100%); background: var(--color-neutral-900); border-left: 1px solid var(--line); z-index: 50; display: flex; flex-direction: column; animation: xpSlide .22s ease-out; box-shadow: -20px 0 40px rgba(0,0,0,.35); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: var(--radius-md); background: var(--color-accent-800); border: 1px solid var(--color-accent-600); color: var(--color-accent-100); font-size: 13px; box-shadow: var(--shadow-md); animation: xpFadeIn .2s; max-width: calc(100% - 32px); }

  @media (max-width: 960px) {
    .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
    .grid4, .tree { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 760px) {
    .shell { flex-direction: column; }
    .side { flex: none; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; gap: 2px; }
    .side-item { width: auto; white-space: nowrap; }
    .side-foot, .side-title { display: none; }
    .main { padding: 20px 16px 72px; }
    .top { gap: 10px; padding: 0 12px; }
    .hide-sm { display: none !important; }
    .grid-half { grid-template-columns: minmax(0, 1fr); }
    .grid4, .tree { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 520px) {
    .tree { grid-template-columns: minmax(0, 1fr); }
    .h-page { font-size: 23px; }
  }
</style>
</head>
<body>
<header class="top" id="top"></header>
<div id="app"></div>
<div id="drawer"></div>
<div id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   Xpedia v15 · Roadmaps. Mockup sin backend: la IA está simulada
   con respuestas precargadas que salen de docs/rutas/*.md.
   ════════════════════════════════════════════════════════════════ */

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PACES = [{ m: 10, l: '10 min' }, { m: 20, l: '20 min' }, { m: 60, l: '1 h' }, { m: 120, l: '2 h o más' }];

/* ── Rutas piloto ─────────────────────────────────────────────── */
const ROUTES = {
  sistemas: {
    id: 'sistemas', short: 'Desarrollo web desde cero', icon: 'ph-code', kind: 'Ruta técnica', goal: 'arrancar',
    title: 'Desarrollo web desde cero',
    meta: 'Postularte a frontend junior o trainee con un sitio publicado, 3 proyectos en GitHub y una entrevista técnica simulada aprobada.',
    from: 'Sin experiencia en programación',
    eta: { 10: '~5 años', 20: '~2,5 años', 60: '~10 meses', 120: '~5 meses' },
    recPace: 60,
    paceNote: 'Son unas 300 h de práctica. Con 10-20 min por día la ruta sirve para explorar: en 5-10 semanas terminás el hito 1 y sabés si te gusta. Para cambiar de trabajo recomendamos 1 h por día, y la sesión de 10 minutos queda como piso para los días en que no da para más.',
    demoWhen: 'a los 5 meses (con 1 h por día)',
    cur: 5,
    hitos: [

      ${a !== undefined && q.knew && D.knew[i] === undefined ? `<div class="panel tight flat row wrapx between"><span class="small">¿Lo sabías o lo adivinaste?</span><span class="row"><button class="btn btn-secondary btn-sm" data-act="diagKnew" data-arg="1">Lo sabía</button><button class="btn btn-secondary btn-sm" data-act="diagKnew" data-arg="0">Lo adiviné</button></span></div>` : ''}`;
    canNext = a !== undefined && (!q.knew || D.knew[i] !== undefined);
  } else if (q.type === 'chips') {
    const sel = D.chips[i] || [];
    body = `<div class="row wrapx">${q.opts.map((o, k) => `<button class="chipbtn ${sel.includes(k) ? 'on' : ''}" data-act="diagChip" data-arg="${k}">${esc(o)}</button>`).join('')}</div><span class="tiny muted">${q.single ? 'Elegí una opción.' : 'Podés elegir varias.'}</span>`;
    canNext = sel.length > 0;
  } else if (q.type === 'text') {
    body = `<div class="bub them" style="max-width:100%">${esc(q.quote)}</div><textarea class="input" data-model="diag.text" rows="5" placeholder="${esc(q.ph)}">${esc(D.text)}</textarea><span class="tiny muted">La IA mira el saludo, si reconocés el problema, el próximo paso y si pedís solo el dato necesario. La ortografía pesa poco.</span>`;

  } else if (q.type === 'record') {
    const pct = D.rec / 60;
    body = `<p class="small soft">${esc(q.alt)}</p>
      <div class="panel flat row wrapx" style="gap:20px;justify-content:center;padding:26px">
        ${ringSvg(pct, D.rec >= 60 ? 'var(--ok)' : 'var(--color-accent)', `<b>${fmt(D.rec)}</b><span class="tiny muted">de 1:00</span>`)}
        <div class="stack-sm" style="min-width:200px">
          ${D.recDone ? '<span class="chip ok"><i class="ph ph-check"></i>Grabación lista</span>' : D.rec > 0 ? `<span class="row small"><span class="rec-dot"></span>Grabando… (simulado)</span>${wave()}` : '<span class="small soft">Solo audio. El video queda apagado.</span>'}
          ${!D.recDone && D.rec === 0 ? '<button class="btn btn-solid" data-act="diagRec"><i class="ph-fill ph-microphone"></i>Grabar 60 s</button>' : ''}
          <span class="tiny muted">En la versión real, después la IA te hace una repregunta corta para ver cómo respondés sin preparación.</span>
        </div>
      </div>`;
    canNext = D.recDone;
  }
  return `<div class="stack" style="gap:20px">
    ${onbDots(3)}
    <div class="row between"><div class="kicker">Diagnóstico · ${esc(R().short)} · ${i + 1} de ${steps.length}</div>${q.tag ? `<span class="chip acc">${esc(q.tag)}</span>` : q.block ? `<span class="chip">${esc(q.block)}</span>` : ''}</div>
    <h1 class="h-page" style="font-size:24px">${esc(q.q)}</h1>
    ${body}
    <div class="row between"><button class="btn btn-ghost" data-act="diagBack"><i class="ph ph-arrow-left"></i>Atrás</button><button class="btn btn-solid" data-act="diagNext" ${canNext ? '' : 'disabled'}>${i === steps.length - 1 ? 'Ver resultado' : 'Siguiente'} <i class="ph ph-arrow-right"></i></button></div>
  </div>`;
}
function fmt(s) { return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; }
function wave(n = 22) { return `<div class="wave">${Array.from({ length: n }, (_, k) => `<span style="animation-delay:${(k * 73) % 900}ms"></span>`).join('')}</div>`; }
function ringSvg(pct, color, inner) {
  const c = 2 * Math.PI * 80;
  return `<div class="ring"><svg width="172" height="172"><circle cx="86" cy="86" r="80" fill="none" stroke="var(--color-neutral-800)" stroke-width="6"/><circle cx="86" cy="86" r="80" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.min(1, pct))}" style="transition:stroke-dashoffset .2s"/></svg>${inner}</div>`;
}

function diagResult() {
  const r = R(); const D = S.diag; const steps = DIAG[S.route];
  let main = '';
  if (S.route === 'sistemas') {
    const res = steps.map((q, i) => ({ b: q.block, ok: D.ans[i] === q.ok, knew: D.knew[i] === true }));
    const solid = (i) => res[i].ok && res[i].knew;
    const adj = [];
    if (!solid(0) || !solid(1)) adj.push('Arrancás en el hito 1, nodo «Cómo funciona la web».');
    else adj.push('Sabés lo básico de HTML: podés rendir la prueba de salto del hito 1 (10-15 min) y quedarte con su evidencia.');
    if (solid(2)) adj.push('Acertaste JavaScript sabiéndolo: más adelante podés rendir la prueba de salto del hito 5.');
    if (S.pace < 60) adj.push('Con tu ritmo, la ruta sirve para explorar. Te recomendamos 1 h por día si querés cambiar de trabajo.');
    adj.push('Las respuestas adivinadas cuentan como no sabidas: así no te salteamos algo que te falta.');
    main = `<div class="panel stack"><h2 class="h-sec">Dónde estás hoy</h2>
      ${res.map((x) => `<div class="row between"><span>${x.b}</span><span class="chip ${x.ok && x.knew ? 'ok' : x.ok ? 'warn' : ''}">${x.ok && x.knew ? 'Lo sabés' : x.ok ? 'Acertaste, pero lo adivinaste' : 'Para aprender'}</span></div>`).join('')}</div>
      <div class="panel stack"><h2 class="h-sec">Cómo se ajusta tu roadmap</h2><ul class="stack-sm small" style="margin:0;padding-left:18px">${adj.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></div>`;
  } else if (S.route === 'atencion') {
    const b1 = D.ans[1] === 1; const b2 = D.ans[2] === 2;
    const insight = b1 && !b2 ? ['La habilidad está: lo que falta es el canal.', 'En el salón resolviste bien; por chat, todavía no. Esta ruta trabaja justo eso: llevar lo que ya sabés hacer a la pantalla.']
      : b1 && b2 ? ['Ya resolvés bien en los dos canales.', 'El hito 2 se acorta: podés rendir directamente su prueba de salida.']
        : !b1 && b2 ? ['Por escrito resolviste bien.', 'Vamos a reforzar cómo se desescala un reclamo, que vale para cualquier canal.']
          : ['Vamos de a poco.', 'Arrancamos por el hito 1 y practicamos cómo calmar un reclamo antes de pasar al chat.'];
    const words = D.text.trim().split(/\s+/).filter(Boolean).length;
    const greet = /^(hola|buen|buenas)/i.test(D.text.trim());
    const step = /(cambi|envi|retir|devol|te mando|te paso|link|etiqueta)/i.test(D.text);
    main = `<div class="fb info"><b style="font-weight:500">${insight[0]}</b><br><span class="small">${insight[1]}</span></div>
      <div class="panel stack"><h2 class="h-sec">Tu mapa de habilidades transferibles</h2>
        <table class="table"><thead><tr><th>Lo que hacés hoy</th><th>En atención remota se llama</th><th>Nivel</th></tr></thead><tbody>
        ${[['Atender 6 mesas sin olvidarte de nadie', 'Manejar varios chats a la vez', 'd'], ['Calmar a una mesa que esperó demasiado', 'Desescalar un reclamo', b1 ? 's' : 'd'], ['Repetir el pedido para confirmarlo', 'Indagar y confirmar antes de resolver', 's'], ['Cerrar la caja y que cuadre', 'Seguir un procedimiento y registrar sin errores', 'd'], ['Pasarle un problema al encargado', 'Escalar con una buena nota interna', 'i'], ['Escribirle a un cliente', 'Lenguaje claro en chat y mail', b2 ? 'd' : 'i']].map(([a, b, l]) => `<tr><td>${a}</td><td>${b}</td><td><span class="lvl ${l}">${l === 's' ? 'Fuerte' : l === 'd' ? 'Medio' : 'Inicial'}</span></td></tr>`).join('')}
        </tbody></table></div>
      <div class="panel stack"><h2 class="h-sec">Tu respuesta escrita</h2>
        ${words < 4 ? '<p class="small soft">No escribiste una respuesta: la practicamos en el hito 2.</p>' : `<div class="stack-sm small">
          <div class="row"><i class="ph ${greet ? 'ph-check t-ok' : 'ph-x t-bad'}"></i>Saludo</div>
          <div class="row"><i class="ph ${step ? 'ph-check t-ok' : 'ph-x t-bad'}"></i>Próximo paso concreto (cambio, envío, retiro)</div>
          <div class="row"><i class="ph ph-info soft"></i>${words} palabras · evaluación simulada: en la app real la hace la IA con la rúbrica</div></div>`}
      </div>
      <div class="panel stack"><h2 class="h-sec">Cómo se ajusta tu roadmap</h2><ul class="stack-sm small" style="margin:0;padding-left:18px">
        ${b1 ? '<li>Como el trato te sale fuerte, el roleplay del hito 3 arranca en el nivel 2.</li>' : ''}
        <li>Cada prueba de salida vuelve a medir y reajusta el plan.</li>
        <li>Aviso honesto: muchas búsquedas piden PC, buena conexión y un lugar silencioso. La práctica igual se puede hacer desde el celular.</li></ul></div>`;
  } else {
    const nerv = D.nerv;
    main = `<div class="panel stack"><h2 class="h-sec">Tu fortaleza</h2><p class="lead">Tenés datos concretos: nombraste lo que hiciste y con quién. Es la base de una buena intervención.</p></div>
      <div class="panel stack"><h2 class="h-sec">Dónde estás hoy</h2>
        ${[['Estructura', 'd'], ['Claridad', 'd'], ['Fluidez', 'i'], ['Respuesta bajo presión', 'i']].map(([n, l]) => `<div class="stack-sm"><div class="row between"><span>${n}</span><span class="lvl ${l}">${LVL[l]}</span></div><div class="bar"><span style="width:${l === 's' ? 100 : l === 'd' ? 55 : 22}%"></span></div></div>`).join('')}
        <span class="tiny muted">Sin puntaje numérico y nunca comparado con otras personas.</span></div>
      <div class="panel stack"><h2 class="h-sec">Cómo se ajusta tu roadmap</h2><ul class="stack-sm small" style="margin:0;padding-left:18px">
        ${nerv >= 7 ? '<li>Marcaste nervios altos: el hito 1 pasa de 5 a 7 sesiones, la primera semana es solo práctica privada y los desafíos reales empiezan chiquitos.</li>' : '<li>Tus nervios están en un rango manejable: los desafíos reales empiezan en la semana 1.</li>'}
        <li>Fluidez inicial: sumamos un microejercicio de pausas a cada sesión.</li>
        <li>Si un criterio se estanca 3 sesiones, la IA te propone un ejercicio específico.</li></ul></div>`;
  }
  return `<div class="stack" style="gap:18px">
    ${onbDots(3)}
    <div><div class="kicker">Resultado del diagnóstico</div><h1 class="h-page">Tu punto de partida</h1><p class="lead">Ruta ${esc(r.short)} · ${paceLabel()} por día · llegás en ${esc(r.eta[S.pace])}</p></div>
    ${main}
    <div class="row wrapx"><button class="btn btn-solid" data-act="start">Ver mi roadmap <i class="ph ph-arrow-right"></i></button></div>
  </div>`;
}

  const comp = [['Desescalar reclamos', 2, 2, 3], ['Escritura clara en chat y mail', 2, 1, 3], ['Política de envíos y reembolsos', 2, 2, 3], ['Datos personales y verificación', 2, 2, 3], ['Atención telefónica', 0, 2, 2]];
  const people = [['Lucas M.', [2, 1, 1, 2, 0], 'Chat N1', 'Hito 3'], ['Sofía R.', [3, 2, 2, 2, 1], 'Chat N1', 'Listo/a para operar'], ['Diego P.', [1, 2, 1, 1, 0], 'Chat N1', 'Hito 2'], ['Ana T.', [2, 2, 3, 2, 2], 'Voz N1', 'Hito 5']];
  const heat = (v, exp) => { const gap = v - exp; const bg = gap >= 0 ? 'color-mix(in srgb, var(--ok) 30%, transparent)' : gap === -1 ? 'color-mix(in srgb, var(--warn) 30%, transparent)' : 'color-mix(in srgb, var(--bad) 30%, transparent)'; return `<span class="heat" style="background:${bg}">${v}</span>`; };
  return `<main class="main"><div class="wrap page stack" style="gap:18px">
    <div class="banner"><i class="ph ph-buildings"></i><span>Vista previa de la versión empresas. El foco del piloto es la persona; esto muestra cómo se monetiza.</span></div>
    <div><div class="kicker">Andén Store · Atención al cliente</div><h1 class="h-page">Rutas de tu empresa</h1><p class="lead">Subí tu matriz de competencias y tus documentos. Xpedia adapta sus rutas a tus políticas, y el roadmap de cada persona es la brecha entre el nivel esperado de su rol y el que midió.</p></div>
    <div class="grid2">
      <div class="panel stack">
        <div class="row between"><h2 class="h-sec">1 · Matriz de competencias</h2>${L ? '<span class="chip ok"><i class="ph ph-check"></i>matriz-atencion.xlsx</span>' : ''}</div>
        ${L ? `<table class="table"><thead><tr><th>Competencia</th><th>Chat N1</th><th>Voz N1</th><th>Escalamiento N2</th></tr></thead><tbody>${comp.map(([c, a, b, d]) => `<tr><td>${c}</td><td>${a}</td><td>${b}</td><td>${d}</td></tr>`).join('')}</tbody></table><span class="tiny muted">Nivel esperado de 0 a 3. Si no tenés matriz, partimos de O*NET y ESCO (CC BY 4.0).</span>`
          : `<button class="choice" data-act="empLoad" style="flex-direction:column;align-items:center;padding:30px;border-style:dashed;text-align:center"><i class="ph ph-upload-simple" style="font-size:28px;color:var(--color-accent-300)"></i><span>Subí tu matriz (Excel o CSV) y tus documentos</span><span class="tiny muted">Políticas, macros, guía de tono, motivos de contacto frecuentes</span></button>`}
      </div>
      <div class="panel stack">
        <h2 class="h-sec">2 · Lo que entendió Xpedia</h2>
        ${L ? `<p class="small soft">Puntos clave de tus documentos, con su página. Reemplazan a la tienda ficticia de la ruta base.</p>
          ${[['Política de envíos v4', 'pág. 3', 'Si el seguimiento no cambia en 72 h hábiles, abrir reclamo con el correo.'], ['Política de reembolsos', 'pág. 1', 'El reembolso vuelve al mismo medio de pago, en hasta 10 días hábiles.'], ['Macros de chat', 'macro 12', 'Demora de envío: reconocer, dar estado real, ofrecer opción.'], ['Guía de tono', 'pág. 2', 'Tuteo, sin diminutivos, sin «estimado cliente».']].map(([d, p, k]) => `<div class="row" style="align-items:flex-start;padding:4px 0"><span class="src" style="flex:none">${d} · ${p}</span><span class="small">${k}</span></div>`).join('')}`
          : '<p class="small muted">Aparece cuando subas tus documentos.</p>'}
      </div>
    </div>
    ${L ? `<div class="panel stack">
      <div class="row wrapx between"><h2 class="h-sec">3 · Tu equipo</h2><span class="tiny muted">Nivel medido contra el esperado del rol · verde: cumple · amarillo: le falta 1 · rojo: le faltan 2 o más</span></div>
      <div style="overflow-x:auto"><table class="table"><thead><tr><th>Persona</th><th>Rol</th>${comp.map(([c]) => `<th style="min-width:90px">${c}</th>`).join('')}<th>Estado</th></tr></thead><tbody>
        ${people.map(([n, lv, rol, st]) => `<tr><td>${n}</td><td class="soft">${rol}</td>${lv.map((v, k) => `<td>${heat(v, rol === 'Voz N1' ? comp[k][2] : comp[k][1])}</td>`).join('')}<td><span class="chip ${st.startsWith('Listo') ? 'ok' : ''}">${st}</span></td></tr>`).join('')}
      </tbody></table></div>
    </div>
    <div class="grid2">
      <div class="panel stack-sm"><h2 class="h-sec">Puntos clave más fallados</h2>
        ${[['Reembolso a tarjeta', 41], ['Verificación de identidad antes de dar datos', 28], ['Cupón máximo sin supervisor', 17]].map(([t, p]) => `<div class="stack-sm" style="padding:4px 0"><div class="row between small"><span>${t}</span><span class="soft">${p} % de errores</span></div><div class="bar"><span style="width:${p}%;background:${p > 30 ? 'var(--bad)' : 'var(--warn)'}"></span></div></div>`).join('')}
        <div class="note"><i class="ph ph-lightbulb"></i><span>Si el 41 % falla lo mismo, probablemente la política es confusa, no solo la gente. <a href="#" data-act="toast" data-arg="Abre la política de reembolsos en la página 1 para revisarla (simulado)">Revisar la política</a></span></div></div>
      <div class="panel stack-sm"><h2 class="h-sec">Privacidad</h2><ul class="small soft stack-sm" style="margin:0;padding-left:16px"><li>La empresa nunca escucha ni lee las prácticas: ve niveles agregados de grupos de 5 personas o más.</li><li>De cada persona ve el estado de los hitos y el resultado de la prueba final.</li><li>Los resultados de la práctica no se usan para evaluar el desempeño.</li><li>No hay reconocimiento de emociones.</li></ul></div>
    </div>` : ''}
  </div></main>`;
}

/* ── Acciones ─────────────────────────────────────────────────── */
const A = {
  view(v) { S.view = v; S.coachOpen = false; clearTimer(); render(); window.scrollTo(0, 0); },
  reset() { clearTimer(); S = initial(); render(); window.scrollTo(0, 0); },
  goal(g) { S.goal = g; S.route = Object.values(ROUTES).find((r) => r.goal === g).id; S.onb = 1; render(); },
  onbBack() { S.onb = Math.max(0, S.onb - 1); render(); },
  pickRoute(id) { S.route = id; S.pace = ROUTES[id].recPace; S.onb = 2; render(); window.scrollTo(0, 0); },
  pace(m) { S.pace = +m; render(); },
  startDiag() { S.diag = initial().diag; go('diag'); },
  skipDiag() { A.start(); },
  diagPick(k) { S.diag.ans[S.diag.i] = +k; render(); },
  diagKnew(v) { S.diag.knew[S.diag.i] = v === '1'; render(); },
  diagChip(k) {
    const q = DIAG[S.route][S.diag.i]; const cur = S.diag.chips[S.diag.i] || []; k = +k;
    S.diag.chips[S.diag.i] = q.single ? [k] : (cur.includes(k) ? cur.filter((x) => x !== k) : [...cur, k]);
    render();
  },
  diagRec() {
    clearTimer(); S.diag.rec = 0.5; render();
    const start = Date.now();
    timer = setInterval(() => { S.diag.rec = Math.min(60, Math.max(0.5, Math.floor((Date.now() - start) / 55))); if (S.diag.rec >= 60) { clearTimer(); S.diag.recDone = true; } render(); }, 55);
  },
  diagNext() { clearTimer(); if (S.diag.i < DIAG[S.route].length - 1) { S.diag.i++; render(); } else go('diagResult'); },
  diagBack() { clearTimer(); if (S.diag.i > 0) { S.diag.i--; render(); } else { S.onb = 2; go('onb'); } },
  start() { S.started = true; S.banner = true; go('home'); },
  banner() { S.banner = false; render(); },
  nav(k) {
    S.coachOpen = false;
    if (k === 'mech') { S.fromSession = false; go(R().mech.key); return; }
    go(k);
  },
  coach() { S.coachOpen = !S.coachOpen; render(); },
  coachCta(label) {
    if (/roleplay|ensayo/i.test(label)) { S.coachOpen = false; S.fromSession = false; go(R().mech.key); return; }
    if (/nodo/i.test(label)) { S.coachOpen = false; go('progress'); return; }
    toast(/Agregar/.test(label) ? 'Sumado a tu ruta como lectura. Al volver te tomamos un caso de 2 minutos.' : /prueba/i.test(label) ? 'Prueba de salto agendada para tu próxima sesión (simulado).' : 'Listo, lo ajusté en tu roadmap.');
  },
  ask(k) { const [q, a] = R().faq[+k]; S.coachMsgs.push({ who: 'me', t: q }, { who: 'ai', t: a }); render(); },
  askFree() {
    const el = document.getElementById('coachIn'); const q = (el && el.value.trim()) || ''; if (!q) return;
    S.coachMsgs.push({ who: 'me', t: q }, { who: 'ai', t: 'En la app real te respondo con tu progreso y las fuentes de tu ruta. En este mockup probá con las preguntas sugeridas.' });
    render();
  },
  toast(msg) { toast(msg); },
  checkin(o) { S.checkin = o; render(); },
  gh() { S.ghConnected = true; render(); toast(R().challenge.toast); },
  route(id) { A.switchRoute(id); },
  switchRoute(id) { clearTimer(); S.route = id; S.ticket = newTicket(); S.rp = newRp(); S.ens = newEns(); S.sess = initial().sess; S.checkin = null; S.coachMsgs = []; S.banner = true; go('home'); },
  newRoute() { toast('Podés seguir varias rutas a la vez. En la demo, cambiá de ruta desde el selector de arriba.'); },
  // sesión
  sessReveal() { S.sess.reveal = true; render(); },
  sessKnew(v) {
    S.sess.knew.push(v === '1'); S.sess.reveal = false;
    if (S.sess.card < R().session.repaso.length - 1) S.sess.card++; else S.sess.step = 1;
    render();
  },
  sessStep(n) { S.sess.step = +n; render(); window.scrollTo(0, 0); },
  startMech(from) { S.fromSession = from === 'session'; go(R().mech.key); },
  backToSession() { S.sess.step = 3; S.fromSession = false; go('session'); },
  // ticket
  tkStep(n) { S.ticket.step = +n; render(); window.scrollTo(0, 0); },
  tkPick(k) {
    const T = S.ticket; const d = TK_DEC[T.step]; k = +k;
    if (T.picks[T.step].length === 0) T.score[T.step] = d.opts[k].ok ? 10 : d.opts[k].partial ? 5 : 0;
    T.picks[T.step].push(k); render();
  },
  tkRun() {
    const T = S.ticket; const res = runTicketTests(T.code); T.tests = res.tests; T.testFb = ticketFeedback(T.code, res);
    T.testScore = Math.max(T.testScore, Math.round((res.tests.filter((t) => t.ok).length / 6) * 40)); render();
  },
  tkHint() { S.ticket.hint = true; render(); },
  tkResetCode() { S.ticket.code = TK_JS; S.ticket.tests = null; S.ticket.testFb = null; render(); },
  tkEval() {
    const T = S.ticket; const c = evalCommit(T.commit); const m = evalMarta(T.marta);
    const commitScore = Math.min(15, c.slice(0, 3).filter((x) => x.ok).length * 4 + (c[3].ok ? 3 : 0));
    const martaScore = Math.round((m.filter((x) => x.ok).length / 4) * 15);
    T.evald = { commit: c, marta: m, commitScore, martaScore }; render();
  },
  tkSave() { S.ticket.saved = true; const r = tkResult(); S.saved.push({ route: 'sistemas', t: 'Ticket #142 · «El carrito suma mal» resuelto', sub: `${r.total}/100 · modo práctica` }); markDone(`Ticket de bug, ${r.total}/100`); render(); toast('Guardado en tu portfolio.'); },
  tkRetry() { S.ticket = newTicket(); render(); window.scrollTo(0, 0); },
  // roleplay
  rpMode(m) { if (S.rp.picks.length === 0) { S.rp.mode = m; render(); } },
  rpPick(k) {
    const P = S.rp; if (P.typing || P.ended) return; const i = P.picks.length; const o = RP_TURNS[i].opts[+k];
    P.picks.push(+k); P.msgs.push({ who: 'me', t: o.t }); P.typing = true; render();
    timer = setTimeout(() => {
      P.anger = Math.max(0, Math.min(10, P.anger + o.d)); P.curve.push(P.anger);
      P.msgs.push({ who: 'tip', t: o.tip, d: o.d });
      P.msgs.push({ who: 'them', t: o.reply + (P.anger >= 10 ? ' Si no me das una solución ya, quiero hablar con un supervisor.' : '') });
      const next = RP_TURNS[i + 1];
      if (next && next.sys) P.msgs.push({ who: 'sys', t: next.sys });
      if (next && next.extra) P.msgs.push({ who: 'them', t: next.extra });
      P.typing = false;
      if (i === RP_TURNS.length - 1) { render(); timer = setTimeout(() => { P.ended = true; markDone(`Roleplay, ${rpCompute().total}/15`); render(); window.scrollTo(0, 0); }, 1100); return; }
      render();
    }, 850);
  },
  rpSave() { S.rp.saved = true; const c = rpCompute(); S.saved.push({ route: 'atencion', t: 'Roleplay con cliente enojado (Marcelo, nivel 2)', sub: `${c.total}/15 · ${S.rp.mode === 'validacion' ? 'modo validación' : 'modo práctica'}` }); render(); toast('Guardado en tu portfolio.'); },
  rpRetry() { const mode = S.rp.mode; clearTimer(); S.rp = newRp(); S.rp.mode = mode; render(); window.scrollTo(0, 0); },
  // ensayo
  ensStage(s) { S.ens.stage = s; render(); },
  ensRec() {
    const E = S.ens; clearTimer(); E.stage = 'rec'; E.t = 0; render();
    const dur = ENS[E.attempt].dur; const start = Date.now();
    timer = setInterval(() => { E.t = Math.min(dur, Math.floor((Date.now() - start) / 60)); if (E.t >= dur) A.ensStop(); else render(); }, 60);
  },
  ensStop() {
    const E = S.ens; clearTimer(); E.t = ENS[E.attempt].dur; E.stage = 'proc'; E.proc = 0; render();
    const start = Date.now();
    timer = setInterval(() => { E.proc = Math.floor((Date.now() - start) / 650); if (E.proc >= 3) { clearTimer(); E.stage = 'fb'; if (E.attempt === 2) markDone('Ensayo, intento 2: idea principal en el segundo 0'); } render(); }, 650);
  },
  ensRetry() { S.ens.attempt = 2; S.ens.saved = false; S.ens.stage = 'preretry'; render(); window.scrollTo(0, 0); },
  ensSave() { S.ens.saved = true; const a = ENS[S.ens.attempt]; S.saved.push({ route: 'oratoria', t: `Avance de ${fmt(a.dur)} · intento ${S.ens.attempt}`, sub: `idea principal en el segundo ${a.idea} · ${String(a.mpm).replace('.', ',')} muletillas/min` }); render(); toast('Guardado como mejor intento.'); },
  // empresa
  empLoad() { S.empresaLoaded = true; render(); toast('Matriz y documentos cargados (ejemplo).'); },
};
function markDone(label) { S.done[S.route] = { label }; }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset.arg, el);
});
document.addEventListener('input', (e) => {
  const el = e.target; if (!el.dataset || !el.dataset.model) return;
  setPath(el.dataset.model, el.type === 'range' ? +el.value : el.value);
  if (el.dataset.out) document.getElementById(el.dataset.out).textContent = el.value;
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]'); if (el && A[el.dataset.change]) A[el.dataset.change](el.value, el);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'coachIn') A.askFree(); });

render();
</script>
</body>
