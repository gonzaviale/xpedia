name: CI stg (build y test)

on:
  push:
    branches: [stg]
    paths: ["backend/**", ".github/workflows/ci-stg.yml"]
  pull_request:
    branches: [stg]
    paths: ["backend/**", ".github/workflows/ci-stg.yml"]

jobs:
  build-test:
    name: ci-stg
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Los tests usan Testcontainers (pgvector); ubuntu-latest ya trae Docker
      - name: Build y tests
        run: ./mvnw -B verify

      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: backend/target/site/jacoco
          if-no-files-found: ignore
