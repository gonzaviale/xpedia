services:
  - type: web
    name: xpedia-backend
    runtime: docker
    branch: main
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    # El despliegue lo dispara el pipeline (deploy hook) una vez pasados los tests
    autoDeployTrigger: off
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FRONTEND_URL
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
